name: HexScope
options:
  bundleIdPrefix: com.rackandpinecone
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: EKNXJ2NR3G
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HexScope:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rackandpinecone.hexscope
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HexScope
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  HexScopeTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: HexScope
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rackandpinecone.hexscope.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/HexScope.app/Contents/MacOS/HexScope
        "TEST_HOST[sdk=iphone*]": $(BUILT_PRODUCTS_DIR)/HexScope.app/HexScope
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  HexScope:
    build:
      targets:
        HexScope: all
        HexScopeTests: [test]
    test:
      targets:
        - HexScopeTests
